apiVersion: 1

providers:
  - name: shang-pivot
    orgId: 1
    folder: 尚品汇可观测
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

  - name: shang-pivot-local
    orgId: 1
    folder: 尚品汇本地压测
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards-local
      foldersFromFilesStructure: false
