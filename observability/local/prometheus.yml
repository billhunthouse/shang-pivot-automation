global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: shang-pivot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8087"]
        labels:
          instance: shang-pivot
          env: local-perf

  - job_name: shang-pivot-local-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:19187"]
        labels:
          instance: shang-pivot-local
          env: local-perf

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
