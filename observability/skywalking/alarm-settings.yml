rules:
  service_resp_time_rule:
    expression: sum(service_resp_time > 1000) >= 3
    period: 10
    silence-period: 5
    message: "服务 {name} 最近 10 分钟有 3 次响应时间超过 1000ms"

  service_sla_rule:
    expression: sum(service_sla < 9500) >= 2
    period: 10
    silence-period: 5
    message: "服务 {name} 最近 10 分钟成功率低于 95%"

  service_resp_time_percentile_rule:
    expression: sum(service_percentile{p='95'} > 1000) >= 3
    period: 10
    silence-period: 5
    message: "服务 {name} 最近 10 分钟 P95 响应时间超过 1000ms"

  service_instance_resp_time_rule:
    expression: sum(service_instance_resp_time > 1000) >= 2
    period: 10
    silence-period: 5
    message: "服务实例 {name} 最近 10 分钟有 2 次响应时间超过 1000ms"

  database_access_resp_time_rule:
    expression: sum(database_access_resp_time > 200) >= 2
    period: 10
    silence-period: 5
    message: "数据库访问 {name} 最近 10 分钟有 2 次超过 200ms"

  endpoint_resp_time_rule:
    expression: sum(endpoint_resp_time > 1000) >= 2
    period: 10
    silence-period: 5
    message: "端点 {name} 最近 10 分钟有 2 次响应时间超过 1000ms"

  endpoint_sla_rule:
    expression: sum(endpoint_sla < 9500) >= 2
    period: 10
    silence-period: 5
    message: "端点 {name} 最近 10 分钟成功率低于 95%"

  instance_jvm_cpu_rule:
    expression: sum(instance_jvm_cpu > 80) >= 3
    period: 10
    silence-period: 5
    message: "实例 {name} 最近 10 分钟 JVM CPU 超过 80%"

hooks:
  webhook:
    default:
      is-default: true
      urls:
        - http://host.docker.internal:18080/alarm
