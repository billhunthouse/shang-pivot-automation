[project]
name = "shang-agent-service"
version = "0.1.0"
description = "Phase-0 LangGraph agent service for ShangPivot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "httpx>=0.27",
  "pydantic>=2.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23"
]
rag = [
  "fastembed>=0.7",
  "psycopg[binary]>=3.2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
